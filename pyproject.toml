[project]
name = "prompt-optimizer"
version = "0.1.0"
description = "Automated prompt and few-shot optimization: compile prompts against a metric with search over instructions and labeled demonstrations"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Adeolu Ogunnoiki" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies = [
    "httpx>=0.28",
    "langdetect>=1.0.9",
    "numpy>=2.3",
]

[dependency-groups]
dev = [
    "ruff>=0.17",
    "mypy>=2.4",
    "pytest>=9.2",
    "pytest-cov>=7.0",
    "hypothesis>=6.170",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prompt_optimizer"]

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "C4", "RUF"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["prompt_optimizer"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["langdetect", "langdetect.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-ra -q -m 'not integration' --basetemp=.pytest_tmp"
testpaths = ["tests"]
markers = ["integration: needs a running llama-server and downloaded data (opt-in)"]

[tool.coverage.run]
source = ["src"]
branch = true
